name: Tests

on:
  push:
    branches: [main, master, dev, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'setup.py'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [main, master, dev, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'setup.py'
      - '.github/workflows/tests.yml'
  workflow_dispatch:

jobs:
  approval-gate:
    name: Maintainer Approval
    runs-on: ubuntu-latest
    environment: maintainer-approved
    steps:
      - name: Approval granted
        run: echo "Approved by maintainer"

  unit-tests:
    name: Unit Tests - py${{ matrix.python-version }} - ${{ matrix.os }}
    needs: approval-gate
    if: |
      always() &&
      needs.approval-gate.result == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        os: [ubuntu-latest]
        include:
          - os: macos-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.10"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js (for console build)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: console/package-lock.json

      - name: Build console frontend
        shell: bash
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          cd console && npm ci && npm run build

      - name: Copy console build into package
        shell: bash
        run: |
          rm -rf src/qwenpaw/console/*
          mkdir -p src/qwenpaw/console
          cp -R console/dist/* src/qwenpaw/console/

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,full]"

      - name: Run all unit tests
        shell: bash
        run: |
          pytest tests/unit -v

  integrated-tests:
    name: Integrated Tests - py${{ matrix.python-version }} - ${{ matrix.os }}
    needs: approval-gate
    if: |
      always() &&
      needs.approval-gate.result == 'success'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
        os: [ubuntu-latest]
        include:
          - os: macos-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.10"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js (for console build)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: console/package-lock.json

      - name: Build console frontend
        shell: bash
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          cd console && npm ci && npm run build

      - name: Copy console build into package
        shell: bash
        run: |
          rm -rf src/qwenpaw/console/*
          mkdir -p src/qwenpaw/console
          cp -R console/dist/* src/qwenpaw/console/

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,full]"

      - name: Check if integrated tests exist
        id: check-integrated
        shell: bash
        run: |
          if [ -d "tests/integration" ] && compgen -G "tests/integration/*.py" > /dev/null; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine pytest marker expression
        id: marker
        if: steps.check-integrated.outputs.has_tests == 'true'
        shell: bash
        run: |
          # PR gate -> p0 only (fast feedback)
          # push / workflow_dispatch -> p0 + p1 (full pre-merge gate)
          # nightly full sweep lives in integration-nightly.yml
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            EXPR="integration and p0"
          else
            EXPR="integration and (p0 or p1)"
          fi
          echo "expr=$EXPR" >> "$GITHUB_OUTPUT"
          echo "Selected marker expression: $EXPR"

      - name: Run integrated tests
        if: steps.check-integrated.outputs.has_tests == 'true'
        shell: bash
        run: |
          pytest tests/integration -v -m "${{ steps.marker.outputs.expr }}"

  coverage-report:
    name: Coverage Report
    needs: approval-gate
    if: |
      always() &&
      needs.approval-gate.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js (for console build)
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: console/package-lock.json

      - name: Build console frontend
        shell: bash
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          cd console && npm ci && npm run build

      - name: Copy console build into package
        shell: bash
        run: |
          rm -rf src/qwenpaw/console/*
          mkdir -p src/qwenpaw/console
          cp -R console/dist/* src/qwenpaw/console/

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,full]"

      - name: Run unit tests with coverage
        shell: bash
        env:
          COVERAGE_FILE: .coverage.unit
        run: |
          # No --cov-branch here so that unit/contract data files use the
          # same statement-level format as the integration subprocess
          # rcfile (tests/integration/conftest.py writes branch = false).
          # `coverage combine` rejects mixing statement-only and branch
          # data ("Can't combine statement coverage data with branch
          # data"), so the three tiers must agree on format.
          pytest tests/unit -v \
            --cov=src/qwenpaw \
            --cov-report=term:skip-covered \
            --cov-report=xml:coverage.unit.xml \
            --cov-fail-under=0

      - name: Run contract tests with coverage
        shell: bash
        env:
          COVERAGE_FILE: .coverage.contract
        run: |
          pytest tests/contract -v \
            --cov=src/qwenpaw \
            --cov-report=term:skip-covered \
            --cov-report=xml:coverage.contract.xml \
            --cov-fail-under=0

      - name: Run integration tests with subprocess coverage
        shell: bash
        env:
          QWENPAW_INTEGRATION_COVERAGE: "1"
        run: |
          # Subprocess coverage: app subprocess writes coverage data into
          # .integration_coverage/integration_subproc (combined by the
          # session-finish hook in conftest.py). Parent process must not
          # carry --cov, hence --no-cov here.
          pytest tests/integration -v --no-cov -m integration
          cp .integration_coverage/integration_subproc .coverage.integration
          # `coverage xml` honours [tool.coverage.report] fail_under and
          # exits 2 when below the threshold. We do not want a per-tier
          # tier (which is naturally lower than the combined number) to
          # fail the step, so swallow exit code 2 here. The xml file is
          # still written.
          coverage xml --data-file=.coverage.integration \
            -o coverage.integration.xml || [ "$?" -eq 2 ]

      - name: Combine all coverage data
        shell: bash
        run: |
          # --keep preserves the per-class .coverage.* files so we can read
          # individual percentages in the next step.
          coverage combine --keep \
            .coverage.unit .coverage.contract .coverage.integration
          # Same exit-2 tolerance as above; the combined number is shown
          # in the summary/PR-comment step regardless.
          coverage xml -o coverage.combined.xml || [ "$?" -eq 2 ]
          coverage html -d htmlcov-combined || [ "$?" -eq 2 ]
          echo "Combined coverage report:"
          coverage report --skip-covered --fail-under=0

      - name: Build coverage summary table
        id: cov_summary
        shell: bash
        run: |
          # The default `bash --noprofile --norc -e -o pipefail` shell would
          # propagate a non-zero exit from `coverage report` (or its
          # downstream pipeline) inside $(...) and abort the step before
          # the markdown file is written. We only want a best-effort
          # number per tier — missing or malformed data should fall back
          # to "n/a", not fail the job.
          set +e
          # Extract "TOTAL ... NN.N%" from each per-class data file.
          get_pct() {
            coverage report --data-file="$1" --fail-under=0 2>/dev/null \
              | awk '/^TOTAL/{p=$NF; gsub(/%/,"",p); print p}' \
              | tail -1
          }
          UNIT=$(get_pct .coverage.unit)
          CONTRACT=$(get_pct .coverage.contract)
          INTEGRATION=$(get_pct .coverage.integration)
          COMBINED=$(get_pct .coverage)
          echo "UNIT=${UNIT:-n/a} CONTRACT=${CONTRACT:-n/a} \
INTEGRATION=${INTEGRATION:-n/a} COMBINED=${COMBINED:-n/a}"

          {
            echo "## 📊 Coverage report"
            echo ""
            echo "| Test category | Coverage |"
            echo "|---|---|"
            echo "| Unit        | ${UNIT:-n/a}% |"
            echo "| Contract    | ${CONTRACT:-n/a}% |"
            echo "| Integration | ${INTEGRATION:-n/a}% |"
            echo "| **Combined** | **${COMBINED:-n/a}%** |"
            echo ""
            echo "> Combined = \`coverage combine\` of unit + contract + integration (subprocess mode)."
            echo "> HTML reports under workflow artifact \`coverage-reports\` (\`htmlcov-combined\` / \`htmlcov-integration\`)."
          } > coverage_summary.md

          cat coverage_summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Sticky coverage PR comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('coverage_summary.md', 'utf8');
            const marker = '<!-- qwenpaw-coverage-summary -->';
            const finalBody = `${marker}\n${body}`;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              },
            );
            const existing = comments.find(
              (c) => c.body && c.body.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: finalBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: finalBody,
              });
            }

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage.unit.xml
            coverage.contract.xml
            coverage.integration.xml
            coverage.combined.xml
            htmlcov-combined/
            htmlcov-integration/
          retention-days: 7

  test-summary:
    name: Test Summary
    needs: [approval-gate, unit-tests, integrated-tests, coverage-report]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        shell: bash
        run: |
          echo "Approval gate: ${{ needs.approval-gate.result }}"
          echo "Unit tests: ${{ needs.unit-tests.result }}"
          echo "Integrated tests: ${{ needs.integrated-tests.result }}"

          if [ "${{ needs.approval-gate.result }}" != "success" ]; then
            echo "❌ Approval not granted"
            exit 1
          fi

          if [ "${{ needs.unit-tests.result }}" = "failure" ] || \
             [ "${{ needs.integrated-tests.result }}" = "failure" ]; then
            echo "❌ Some tests failed"
            exit 1
          else
            echo "✅ All tests passed"
          fi
